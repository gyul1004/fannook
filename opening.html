<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>오픈 알림 — FAN NOOK</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="subpage.css">
</head>
<body class="subpage-body">
  <header class="header guide-header">
    <button class="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="menu"><img src="assets/menu.svg" alt=""></button>
    <a href="index.html" class="header-symbol" aria-label="팬누크 홈"><img src="assets/header-symbol.svg" alt=""></a>
    <a href="opening.html" class="header-open" aria-current="page">오픈알림</a>
  </header>
  <main class="subpage application-page">
    <section class="application-ticket" aria-labelledby="opening-sheet-title">
      <header class="subpage-header"><a href="index.html#opening" class="back-link" data-history-back aria-label="이전 페이지로 돌아가기"><img src="assets/open-chevron.svg" alt=""></a></header>
      <div class="application-content">
        <h1 id="opening-sheet-title">OPEN.</h1>
        <form id="opening-page-form" novalidate>
          <label for="page-email">이메일</label><input id="page-email" name="email" type="email" autocomplete="email" placeholder="example@mail.com" aria-describedby="email-error email-help" required>
          <p class="field-error" id="email-error" hidden></p>
          <p class="input-help demo-notice" id="email-help">신청 시연 화면이에요. 이메일은 저장되지 않으며 실제 알림은 발송되지 않아요.</p>
          <div class="privacy-copy"><strong>개인정보 수집 및 이용</strong><p>수집 항목 : 이메일<br>이용 목적 : 팬누크 오픈 알림 발송<br>보유 기간 · 처리 주체 : 운영 전 확정</p></div>
          <label class="consent"><input type="checkbox" name="consent" aria-describedby="consent-error" required> <span><strong>[필수]</strong> 개인정보 수집 및 이용에 동의합니다.</span></label>
          <p class="field-error" id="consent-error" hidden></p>
          <p class="form-note">동의를 거부할 수 있으며, 동의하지 않으면 알림을 신청할 수 없어요.</p><div class="ticket-rule" aria-hidden="true"><img src="assets/open-rule.svg" alt=""></div><button class="button application-submit" type="submit">알림 신청하기</button>
        </form>
      </div>
    </section>
    <section class="application-done"><div class="done-bell" aria-hidden="true"><img src="assets/done-bell.png" alt=""></div><a href="opening.html" class="back-link" data-history-back aria-label="신청 화면으로 돌아가기"><img src="assets/done-chevron.svg" alt=""></a><h2 tabindex="-1">DONE.</h2><h3>알림 신청 시연이<br>완료됐어요.</h3><p>입력한 이메일은 저장되지 않으며,<br>실제 알림은 발송되지 않아요.</p><a class="button done-home" href="index.html">홈으로</a></section>
  </main>
  <dialog id="menu" class="menu-panel" aria-label="전체 메뉴">
    <button class="close" data-close aria-label="메뉴 닫기">×</button>
    <nav aria-label="전체 메뉴">
      <a href="index.html">홈 <span aria-hidden="true">↗</span></a>
      <a href="index.html#spaces">공간 소개 <span aria-hidden="true">↗</span></a>
      <a href="qna.html">이용안내 <span aria-hidden="true">↗</span></a>
      <a href="opening.html" aria-current="page">오픈 알림 <span aria-hidden="true">↗</span></a>
    </nav>
  </dialog>
  <script src="script.js"></script>
  <script src="opening-page.js"></script>
</body>
</html>
